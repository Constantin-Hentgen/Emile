services:
  emile:
    build: .
    container_name: emile
    restart: unless-stopped
    # Each variable is interpolated from `.env` next to this file (docker compose) or from the Portainer stack UI.
    # An unset variable arrives empty and Emile uses its default (see .env.example).
    environment:
      EMILE_DATABASE_URL: ${EMILE_DATABASE_URL:-sqlite:////data/emile.db}
      EMILE_AUTO_MIGRATE: ${EMILE_AUTO_MIGRATE:-true}
      EMILE_ADMIN_KEY: ${EMILE_ADMIN_KEY:-}
      EMILE_SECRET_KEY: ${EMILE_SECRET_KEY:-}
      EMILE_SYNC_INTERVAL: ${EMILE_SYNC_INTERVAL:-60}
      EMILE_DEFAULT_TIMEZONE: ${EMILE_DEFAULT_TIMEZONE:-Europe/Paris}
      EMILE_DEFAULT_LANGUAGE: ${EMILE_DEFAULT_LANGUAGE:-fr}
      EMILE_DEFAULT_CURRENCY: ${EMILE_DEFAULT_CURRENCY:-€}
      EMILE_MAX_LIST_ITEMS: ${EMILE_MAX_LIST_ITEMS:-60}
      EMILE_MAX_STOCK_ITEMS: ${EMILE_MAX_STOCK_ITEMS:-120}
      EMILE_MAX_KEEPS_DAYS: ${EMILE_MAX_KEEPS_DAYS:-60}
      EMILE_ASK_GRACE_DAYS: ${EMILE_ASK_GRACE_DAYS:-3}
      EMILE_SHOP_PAGE: ${EMILE_SHOP_PAGE:-true}
      EMILE_RECIPE_SOURCES: ${EMILE_RECIPE_SOURCES:-wikibooks}
      EMILE_HTTP_TIMEOUT: ${EMILE_HTTP_TIMEOUT:-8}
      EMILE_LOG_LEVEL: ${EMILE_LOG_LEVEL:-INFO}
    ports:
      - "${EMILE_PUBLISHED_PORT:-18010}:8000"
    volumes:
      - emile-data:/data

volumes:
  emile-data:
