services:
  stockpot:
    build: .
    container_name: stockpot
    restart: unless-stopped
    # Each variable is interpolated from `.env` next to this file (docker compose) or from the Portainer stack UI.
    # An unset variable arrives empty and Stockpot uses its default (see .env.example).
    environment:
      STOCKPOT_LOG_LEVEL: ${STOCKPOT_LOG_LEVEL:-INFO}
      STOCKPOT_DATABASE_URL: ${STOCKPOT_DATABASE_URL:-sqlite:////data/stockpot.db}
    ports:
      - "${STOCKPOT_PUBLISHED_PORT:-18010}:8000"
    volumes:
      - stockpot-data:/data

volumes:
  stockpot-data:
