[project]
name = "emile"
version = "0.4.1"
description = "Self-hosted, API-first groceries service: shopping lists, kitchen stock, batch-cooked boxes, recipes, CalDAV sync."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = ["groceries", "shopping-list", "pantry", "meal-prep", "caldav"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Home Automation",
]
# The core library stays importable without the web/DB stack: keep this list minimal.
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Everything the HTTP service needs on top of the core library.
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "tzdata",
    "httpx2>=2.16",
    "caldav>=1.4",
    "icalendar>=6.0",
    "cryptography>=44",
]
# Typed HTTP client for the service (same models as the API).
client = [
    "httpx2>=2.16",
]

[project.scripts]
emile = "emile.cli:main"

[project.urls]
Homepage = "https://github.com/Constantin-Hentgen/Emile"
Documentation = "https://github.com/Constantin-Hentgen/Emile/wiki"
Changelog = "https://github.com/Constantin-Hentgen/Emile/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "emile[service,client]",
    "pytest>=8",
    "httpx2>=2.16.0",
    "ruff>=0.8",
    "mypy>=1.18",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "S", "PT", "C4", "RET"]
# Typographic characters are deliberate in user-facing strings (cost ranges, box counts).
allowed-confusables = ["–", "×", "’"]
ignore = [
    "ANN401",  # Any is sometimes the honest type (raw JSON from clients)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "ANN", "S603", "PT018"]  # fake credentials in tests; compact multi-part asserts read better
"src/emile/service/shop_page.py" = ["E501"]  # an HTML document: long CSS and JS lines are not Python style

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs external services (e.g. a Radicale container); not run by default: select them with -m integration",
]
