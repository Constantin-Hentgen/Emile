name: release-please

# Conventional Commits on main → a release pull request (version + CHANGELOG.md);
# merging it creates the tag and the GitHub release.
on:
  push:
    branches: [main]

# Two merges in a row start two runs; queue them so they don't both push to the release branch.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please can't update uv.lock, and pull requests opened with GITHUB_TOKEN don't trigger CI:
      # on the open release branch, sync the lockfile with the new version and run lint and tests here.
      # The action reports the PR it just opened or updated. Right after creation the label search doesn't find it
      # yet, so use that output first and the label search only when the action left the PR untouched.
      - name: Find the open release pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_ACTION: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
        run: |
          branch="$FROM_ACTION"
          if [ -z "$branch" ]; then
            branch=$(gh pr list -R "${{ github.repository }}" --state open --label "autorelease: pending" \
              --json headRefName -q '.[0].headRefName')
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: ${{ steps.pr.outputs.branch != '' }}
        with:
          ref: ${{ steps.pr.outputs.branch }}
      - uses: astral-sh/setup-uv@v6
        if: ${{ steps.pr.outputs.branch != '' }}
      - name: Sync uv.lock, lint and test the release branch
        if: ${{ steps.pr.outputs.branch != '' }}
        run: |
          uv lock
          uv sync --frozen --python 3.13
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy
          uv run --frozen python -m pytest -q
          if ! git diff --quiet uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync uv.lock with the release version"
            git push
          fi

  # Releases created with GITHUB_TOKEN don't trigger other workflows, so the image is published from here.
  docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/emile
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Emile
            org.opencontainers.image.description=Self-hosted, API-first groceries service
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
