name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.13
      - name: Ruff lint
        run: uv run --frozen ruff check --output-format=github .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Type check
        run: uv run --frozen mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.13
      - name: Tests
        run: uv run --frozen python -m pytest -q

  postgres:
    # SQLite is the default; the same tests run against Postgres so `EMILE_DATABASE_URL` can point at one.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: emile
          POSTGRES_PASSWORD: emile
          POSTGRES_DB: emile
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U emile" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EMILE_TEST_DATABASE_URL: postgresql+psycopg://emile:emile@127.0.0.1:5432/emile
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.13
      - name: Service tests on Postgres
        run: uv run --frozen python -m pytest -q tests/service

  caldav:
    # The calendar sync against a real CalDAV server (Radicale), not just the in-memory fake of the unit tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.13
      - name: Start Radicale
        run: |
          mkdir -p "$RUNNER_TEMP/radicale"
          echo "me:secret" > "$RUNNER_TEMP/radicale/users"
          cat > "$RUNNER_TEMP/radicale/config" <<EOF
          [server]
          hosts = 127.0.0.1:5232
          [auth]
          type = htpasswd
          htpasswd_filename = $RUNNER_TEMP/radicale/users
          htpasswd_encryption = plain
          [storage]
          filesystem_folder = $RUNNER_TEMP/radicale/data
          EOF
          # own virtualenv: a background `uv run` would hold the uv cache lock until the job's cleanup times out
          uv venv "$RUNNER_TEMP/radicale-venv"
          uv pip install --python "$RUNNER_TEMP/radicale-venv/bin/python" "radicale==3.9.1"
          "$RUNNER_TEMP/radicale-venv/bin/python" -m radicale --config "$RUNNER_TEMP/radicale/config" &
          echo $! > "$RUNNER_TEMP/radicale/pid"
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:5232/ && break; sleep 1; done
      - name: Sync tests against Radicale
        env:
          EMILE_TEST_CALDAV_URL: http://127.0.0.1:5232/me/shopping/
          EMILE_TEST_CALDAV_USER: me
          EMILE_TEST_CALDAV_PASSWORD: secret
        run: uv run --frozen python -m pytest -q -m integration
      - name: Stop Radicale
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/radicale/pid")" || true

  docker:
    # `docker compose up` must work on a fresh machine: build, wait for /health, create a key, call the API.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose up and wait for the healthcheck
        run: |
          docker compose up -d --build --wait --wait-timeout 120
          curl -fsS http://127.0.0.1:18010/health
      - name: Create an account in the container and use it
        run: |
          key=$(docker compose exec -T emile emile setup smoke --household Home | tail -1)
          curl -fsS -H "Authorization: Bearer $key" -H "Content-Type: application/json" \
            -d '{"items": [{"name": "Bananas", "qty": "7"}]}' http://127.0.0.1:18010/v1/lists
          curl -fsS -X POST -H "Authorization: Bearer $key" http://127.0.0.1:18010/v1/lists/1/items/0/toggle
          curl -fsS -H "Authorization: Bearer $key" http://127.0.0.1:18010/v1/stock | grep -q Bananas
      - name: Data survives a restart (volume)
        run: |
          docker compose restart emile
          docker compose up -d --wait --wait-timeout 60
          docker compose exec -T emile emile households list | grep -q Home
      - name: Logs
        if: always()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
